<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail – Primary Doctor Workstation</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="workstation">
  <header class="app-header">
    <h1>Mail</h1>
    <span class="user">dr_smith@hospital.local</span>
  </header>
  <nav class="sidebar">
    <a href="/" class="nav-item active">Inbox</a>
    <span class="nav-count">1</span>
  </nav>
  <main class="content">
    <div class="email-list">
      <a href="/email/1" class="email-item unread">
        <span class="email-from">Lab Results &lt;noreply@medlab.example.com&gt;</span>
        <span class="email-subject">Patient lab results – Action required</span>
        <span class="email-preview">Please review the attached results for your patient.</span>
        <span class="email-attachment">📎 patient_lab_results.pdf</span>
      </a>
    </div>
  </main>
</body>
</html>
